name: CI/CD Pipeline - Backend Deploy to GCP

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: maran1947/fluentsoul-backend

jobs:
  check:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'deploy')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pyright

      - name: Backend Lint & Typecheck
        run: |
          cd backend
          ruff check app
          pyright app

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: check
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'deploy')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy Container to GCP VM
    needs: build-and-push
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'deploy')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "==== Connected to GCP Compute Engine VM ===="
            
            WORK_DIR="fluentsoul"
            mkdir -p $WORK_DIR
            cd $WORK_DIR
            
            echo "==== Pulling Latest Docker Compose File ===="
            cat << 'EOF' > docker-compose.prod.yml
            version: '3.8'

            services:
              backend:
                image: ghcr.io/maran1947/fluentsoul-backend:latest
                restart: unless-stopped
                env_file:
                  - ${ENV_FILE:-.env}
                ports:
                  - "8000:8000"
                  - "80:8000"
            EOF
            
            echo "==== Pulling Latest Backend Image from GHCR ===="
            docker compose -f docker-compose.prod.yml pull backend
            
            echo "==== Starting Backend Container Stack ===="
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            
            echo "==== Cleaning up unused images ===="
            docker image prune -f
            
            echo "==== Backend Deployment Complete! ===="

