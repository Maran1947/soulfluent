name: fluentsoul_mobile
description: "Voice-first Group Discussion practice app for FluentSoul"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.1
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  record: ^7.1.1
  just_audio: ^0.9.36
  path_provider: ^2.1.2
  fl_chart: ^0.68.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0F12"
  adaptive_icon_foreground: "assets/icon/launcher_icon.png"

flutter_native_splash:
  color: "#0D0F12"
  image: "assets/icon/launcher_icon.png"
  android_12:
    color: "#0D0F12"
    image: "assets/icon/launcher_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
